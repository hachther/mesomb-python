[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymesomb"
version = "2.1.1"
description = "Python client for MeSomb services."
readme = "README.md"
license = "MIT"
requires-python = ">=3.6"
authors = [{ name = "Hachther LLC", email = "contact@hachther.com" }]
keywords = ["MeSomb", "MobileMoney", "OrangeMoney", "YangoRefill"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests"]

[project.urls]
Homepage = "https://github.com/hachther/mesomb-python-client.git"
Download = "https://pypi.org/project/pymesomb/"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymesomb", "pymesomb.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["pymesomb"]
omit = ["tests/*"]


